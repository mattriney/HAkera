[project]
name = "hakera"
version = "0.4.4"
description = "Home Assistant integration for Makera Z1 monitoring and accessory control"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"

[project.urls]
Documentation = "https://github.com/mattriney/HAkera"
Issues = "https://github.com/mattriney/HAkera/issues"
Source = "https://github.com/mattriney/HAkera"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP", "W"]

[tool.pyright]
include = ["custom_components/hakera", "tools"]
extraPaths = ["custom_components/hakera"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.unittest]
start-directory = "tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
