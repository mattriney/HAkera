[project]
name = "home-assistant-hakera"
version = "0.4.0"
description = "Hakera integration for Makera Z1 / Z1 Pro monitoring and accessory control"
readme = "README.md"
requires-python = ">=3.14.2"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP", "W"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.unittest]
start-directory = "tests"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
