[project]
name = "home-assistant-makera-z1"
version = "0.1.0"
description = "Read-only Home Assistant custom integration for Makera Z1 / Z1 Pro monitoring"
readme = "README.md"
requires-python = ">=3.14.2"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "UP", "W"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.unittest]
start-directory = "tests"
