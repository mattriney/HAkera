name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "custom_components/hakera/manifest.json"
      - ".github/workflows/release.yml"

concurrency:
  group: hakera-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify tag and repository versions
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python -c 'import json; from pathlib import Path; print(json.loads(Path("custom_components/hakera/manifest.json").read_text())["version"])')"
          fi
          python tools/check_release.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a release."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
              if [ "$tag_sha" != "$GITHUB_SHA" ]; then
                echo "::error::Existing tag $RELEASE_TAG points to a different commit."
                exit 1
              fi
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
            fi
          fi
          gh release create "$RELEASE_TAG" \
            --title "HAkera ${RELEASE_TAG#v}" \
            --generate-notes \
            --verify-tag
